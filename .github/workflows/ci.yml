name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW
        run: choco install mingw --no-progress -y
      - name: Configure
        run: cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Tests
        run: ctest --test-dir build --output-on-failure

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install quality tools
        run: sudo apt-get update && sudo apt-get install -y clang-format clang-tidy gcovr valgrind
      - name: Check formatting
        run: find src include tests -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 | xargs -0 clang-format --dry-run --Werror
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Static analysis
        run: clang-tidy -p build src/core/*.cpp src/io/*.cpp
      - name: Tests
        run: ctest --test-dir build --output-on-failure
      - name: Coverage
        run: gcovr -r . build --object-directory build --filter 'src/(core|io)' --fail-under-line 75 --print-summary
      - name: Valgrind
        run: valgrind --leak-check=full --show-leak-kinds=all --error-exitcode=1 ./build/tests/mss_tests
